<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1118"/>
      <stop offset="50%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#1a1f2e"/>
    </linearGradient>

    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="45%" stop-color="#10b981" stop-opacity="0.10"/>
      <stop offset="85%" stop-color="#0e1118" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="squircleBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Cover & Spine Gradients -->
    <linearGradient id="coverLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e2433"/>
      <stop offset="100%" stop-color="#2a3245"/>
    </linearGradient>

    <linearGradient id="coverRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a3245"/>
      <stop offset="100%" stop-color="#1e2433"/>
    </linearGradient>

    <!-- Page Layers (Depth/Stack) -->
    <linearGradient id="pageStack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Left Open Page Gradients -->
    <linearGradient id="leftPageGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d1d5db"/>
      <stop offset="25%" stop-color="#f3f4f6"/>
      <stop offset="85%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Right Open Page (Base) Gradients -->
    <linearGradient id="rightPageGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="20%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#f3f4f6"/>
      <stop offset="100%" stop-color="#d1d5db"/>
    </linearGradient>

    <!-- 3D Turning Page Gradients -->
    <!-- Front Face (Glowing Amber / Gold) -->
    <linearGradient id="turnPageFront" x1="10%" y1="90%" x2="90%" y2="10%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="25%" stop-color="#f59e0b"/>
      <stop offset="55%" stop-color="#fbbf24"/>
      <stop offset="85%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Back / Underside Curl (Warm Rich Gold Shade) -->
    <linearGradient id="turnPageBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="40%" stop-color="#d97706"/>
      <stop offset="80%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>

    <!-- Emerald Ribbon Gradient -->
    <linearGradient id="emeraldRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="40%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Subtle Shadows -->
    <filter id="shadowBlur" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="pageShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="3" dy="8" stdDeviation="7" flood-color="#090d16" flood-opacity="0.45"/>
    </filter>

    <filter id="curlGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 1. Squircle Canvas with Glassmorphic Border -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#ambientGlow)"/>
  <rect x="25.5" y="25.5" width="461" height="461" rx="102.5" fill="none" stroke="url(#squircleBorder)" stroke-width="3"/>

  <!-- 2. Ambient Spine Light Ray -->
  <ellipse cx="256" cy="275" rx="140" ry="110" fill="#f59e0b" opacity="0.08" filter="url(#shadowBlur)"/>

  <!-- 3. Base Book Covers (Hardcover foundation & Spine) -->
  <g filter="url(#shadowBlur)">
    <!-- Left Cover Flap -->
    <path d="M 256 392 L 78 358 C 76 357 74 355 74 352 L 78 206 C 78 203 80 201 83 202 L 256 230 Z" fill="url(#coverLeft)"/>
    <!-- Right Cover Flap -->
    <path d="M 256 392 L 434 358 C 436 357 438 355 438 352 L 434 206 C 434 203 432 201 429 202 L 256 230 Z" fill="url(#coverRight)"/>
    <!-- Spine Rim -->
    <path d="M 250 230 C 254 229 258 229 262 230 L 262 396 C 258 397 254 397 250 396 Z" fill="#1b202c"/>
  </g>

  <!-- 4. Stack of Pages Underneath (Book Volume/Edge) -->
  <path d="M 82 353 C 130 366 195 368 256 384 C 317 368 382 366 430 353 L 428 344 C 382 357 317 359 256 375 C 195 359 130 357 84 344 Z" fill="url(#pageStack)"/>

  <!-- 5. Left Open Pages (Fan of Knowledge) -->
  <g filter="url(#pageShadow)">
    <!-- Bottom Layer Page Left -->
    <path d="M 256 374 C 196 358 135 355 90 342 L 94 196 C 138 208 198 212 256 226 Z" fill="#e2e8f0" opacity="0.5"/>
    <!-- Top Main Page Left -->
    <path d="M 256 368 C 198 353 140 350 96 338 L 102 188 C 144 200 202 204 256 218 Z" fill="url(#leftPageGrad)"/>
    
    <!-- Fine Page Lines on Left Page (Elegance & Detail) -->
    <path d="M 126 232 C 160 238 198 241 234 249" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>
    <path d="M 124 254 C 158 260 196 263 234 271" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>
    <path d="M 122 276 C 156 282 194 285 234 293" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>
    <path d="M 120 298 C 154 304 192 307 234 315" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>
    <path d="M 118 320 C 150 326 186 329 220 335" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>
  </g>

  <!-- 6. Right Open Base Pages -->
  <g filter="url(#pageShadow)">
    <!-- Base Page Right (Lying open flat beneath the curl) -->
    <path d="M 256 368 C 314 353 372 350 416 338 L 410 188 C 368 200 310 204 256 218 Z" fill="url(#rightPageGrad)"/>

    <!-- Fine Page Lines on Right Page Base -->
    <path d="M 278 249 C 314 241 352 238 386 232" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
    <path d="M 278 271 C 314 263 352 260 388 254" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
    <path d="M 278 293 C 316 285 354 282 390 276" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
    <path d="M 278 315 C 318 307 356 304 392 298" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- 7. Dynamic 3D Page Turn (The RealBook Signature Curl) -->
  <!-- Shadow of the Curling Page on Right Base Page -->
  <path d="M 256 368 C 290 320 325 240 338 185 C 352 225 365 295 385 330 C 342 344 298 356 256 368 Z" fill="#0b0e14" opacity="0.3" filter="url(#pageShadow)"/>

  <!-- Turning Page Under-curl (Backside of Page with Golden Warmth) -->
  <g filter="url(#pageShadow)">
    <path d="M 256 218 C 265 200 292 165 342 140 C 372 125 398 128 412 146 C 418 154 420 166 414 184 C 388 170 354 185 328 220 C 302 255 278 315 256 368 Z" fill="url(#turnPageBack)"/>
  </g>

  <!-- Turning Page Top Face (Sweeping Golden Sail catching light) -->
  <g filter="url(#curlGlow)">
    <path d="M 256 218 C 285 228 322 232 355 210 C 388 188 406 156 414 144 C 400 126 370 123 340 138 C 290 162 264 198 256 218 Z" fill="url(#turnPageFront)"/>
  </g>

  <!-- Specular Curve Highlight along the page flip crest -->
  <path d="M 258 217 C 292 165 340 138 412 144" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  <path d="M 264 224 C 295 178 338 152 402 152" fill="none" stroke="#fef08a" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- 8. Silk Bookmark Ribbon (Emerald / Digital Motif) -->
  <g filter="url(#pageShadow)">
    <!-- Ribbon hanging down the center gutter -->
    <path d="M 248 188 L 248 398 L 256 388 L 264 398 L 264 188 Z" fill="url(#emeraldRibbon)"/>
    <!-- Golden trim highlight on the ribbon -->
    <path d="M 248 188 L 248 398" stroke="#6ee7b7" stroke-width="1.2" opacity="0.7"/>
    <!-- Fold at the head of the ribbon -->
    <ellipse cx="256" cy="188" rx="8" ry="3.5" fill="#047857"/>
  </g>

  <!-- 9. Spine Gutter Creep & Shading -->
  <path d="M 254 218 L 254 372 C 255 372 257 372 258 372 L 258 218 Z" fill="#0f172a" opacity="0.35"/>

  <!-- 10. Digital Sparks / Enlightenment Stars -->
  <!-- Main Golden Sparkle near top page turn -->
  <g transform="translate(378, 110)">
    <path d="M 0 -14 Q 0 0 14 0 Q 0 0 0 14 Q 0 0 -14 0 Q 0 0 0 -14 Z" fill="#fbbf24"/>
    <circle cx="0" cy="0" r="3" fill="#ffffff"/>
  </g>
  <!-- Secondary Emerald Sparkle on Left -->
  <g transform="translate(132, 168) scale(0.65)">
    <path d="M 0 -12 Q 0 0 12 0 Q 0 0 0 12 Q 0 0 -12 0 Q 0 0 0 -12 Z" fill="#34d399"/>
    <circle cx="0" cy="0" r="2.5" fill="#ffffff"/>
  </g>
  <!-- Tertiary Micro Sparkle -->
  <circle cx="426" cy="182" r="2.5" fill="#fde047" opacity="0.85"/>
  <circle cx="218" cy="174" r="2" fill="#6ee7b7" opacity="0.75"/>
</svg>
