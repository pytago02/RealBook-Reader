name: Build & Release App (Windows EXE & Android APK)

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows App (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Windows Executable
        run: npm run build && npx electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Clean Release Files
        shell: bash
        run: |
          mkdir -p dist-release
          cp "release/RealBook Reader Setup 1.0.0.exe" "dist-release/RealBook.Reader.Setup.1.0.0.exe"
          cp "release/RealBook Reader 1.0.0.exe" "dist-release/RealBook.Reader.1.0.0.exe"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: dist-release/*.exe

  build-android:
    name: Build Android App (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../RealBook-Reader.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: RealBook-Reader.apk

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: release-files

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-files

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "RealBook Reader v1.0.0"
          body: |
            ## 🎉 RealBook Reader v1.0.0 - Trải nghiệm đọc sách chân thực

            ### 📥 Tải xuống ứng dụng:
            - **Windows (Cài đặt - Setup):** [`RealBook.Reader.Setup.1.0.0.exe`](https://github.com/pytago02/RealBook-Reader/releases/download/v1.0.0/RealBook.Reader.Setup.1.0.0.exe)
            - **Windows (Chạy ngay - Portable):** [`RealBook.Reader.1.0.0.exe`](https://github.com/pytago02/RealBook-Reader/releases/download/v1.0.0/RealBook.Reader.1.0.0.exe)
            - **Android (Mobile APK):** [`RealBook-Reader.apk`](https://github.com/pytago02/RealBook-Reader/releases/download/v1.0.0/RealBook-Reader.apk)

            ---
            ### ✨ Tính năng nổi bật:
            - **Đọc sách chân thực:** Hiệu ứng lật trang 3D uốn lượn, hỗ trợ dàn trang đôi / đơn như sách giấy.
            - **Chế độ tập trung (Focus Mode):** Ẩn toàn bộ thanh công cụ, tối đa hóa chiều dọc hiển thị trang sách.
            - **Thanh công cụ ổn định:** Loại bỏ hiện tượng chớp nháy khi di chuột hoặc thao tác cuộn / lật trang.
            - **Bảo vệ mắt:** 5 chế độ màu sắc (Sáng, Tối, Sepia, Giấy ngà, Mực điện tử) và phông chữ Serif chuyên nghiệp.
            - **Kho sách Online 70.000+ cuốn:** Tích hợp trực tiếp Project Gutenberg, Internet Archive và Open Library với kho sách tiếng Việt phong phú.
            - **Bộ lọc & Tìm kiếm thông minh 2 cấp độ:** Tìm kiếm toàn cục hoặc tìm chính xác trong từng thể loại.
            - **Hỗ trợ đa ngôn ngữ (i18n):** Tiếng Việt, Tiếng Anh, Tiếng Trung, Tiếng Pháp, Tiếng Tây Ban Nha, Tiếng Nhật.
          files: |
            release-files/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
